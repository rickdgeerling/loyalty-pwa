<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loyalty Cards</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("sw.js")
        .then(function (reg) {
          console.log("SW registered:", reg.scope);
        })
        .catch(function (err) {
          console.error("SW registration failed:", err);
        });
    }
  </script>
</head>

<body>
  <div x-data="loyaltyApp" x-cloak>
    <header class="app-header">
      <div class="app-header-left">
        <template x-if="currentPage !== 'list'">
          <button class="btn-link" @click="goBack()">← Back</button>
        </template>
        <template x-if="currentPage === 'list'">
          <span class="app-name">Loyalty</span>
        </template>
      </div>
      <div class="app-header-right">
        <!-- List: Add Card + Settings -->
        <template x-if="currentPage === 'list'">
          <div class="header-actions">
            <button class="btn-link" @click="navigateTo('settings')">Settings</button>
            <button @click="navigateTo('add')">Add Card</button>
          </div>
        </template>
        <!-- View: Edit + Delete -->
        <template x-if="currentPage === 'view' && currentCard">
          <div class="header-actions">
            <button @click="deleteCard(currentCard.id)" class="btn-danger">Delete</button>
            <button @click="navigateTo('edit', currentCard.id)">Edit</button>
          </div>
        </template>
      </div>
    </header>
    <main>
      <!-- Card List -->
      <template x-if="currentPage === 'list'">
        <div>
          <div>
  <!-- Empty State -->
  <template x-if="cards.length === 0">
    <div class="empty-state">
      <p>No loyalty cards yet.</p>
      <button @click="navigateTo('add')">Add your first card</button>
    </div>
  </template>

  <!-- Card List -->
  <template x-if="cards.length > 0">
    <div>
      <template x-for="card in cards" :key="card.id">
        <a
          class="card-row"
          :style="'background-color: ' + card.color + '; color: ' + card.textColor"
          :href="'#view/' + card.id"
          @click.prevent="navigateTo('view', card.id)"
        >
          <span x-text="card.name"></span>
        </a>
      </template>
    </div>
  </template>
</div>

        </div>
      </template>

      <!-- Card View -->
      <template x-if="currentPage === 'view'">
        <div>
          <div>
  <template x-if="currentCard">
    <div>
      <h2 x-text="currentCard.name"></h2>

      <div
        style="
          background: #f5f5f5;
          border-radius: 4px;
          padding: 16px;
          margin-bottom: 16px;
        "
      >
        <img
          class="barcode-img"
          :src="currentCard.barcodeDataURL"
          :alt="'Barcode: ' + currentCard.code"
        />
      </div>

      <p class="barcode-code" x-text="currentCard.code"></p>
    </div>
  </template>

  <template x-if="!currentCard">
    <div class="empty-state">
      <p>Card not found.</p>
      <button @click="navigateTo('list')">Back to list</button>
    </div>
  </template>
</div>

        </div>
      </template>

      <!-- Add/Edit Form -->
      <template x-if="currentPage === 'add' || currentPage === 'edit'">
        <div>
          <div>
  <template x-if="editingId">
    <h2>Edit Card</h2>
  </template>
  <template x-if="!editingId">
    <h2>Add Card</h2>
  </template>

  <form @submit.prevent="editingId ? updateCard() : addCard()">
    <label for="card-name">Name</label>
    <input type="text" id="card-name" x-model="form.name" required placeholder="e.g. Grocery Store" />

    <label for="card-color">Color</label>
    <input type="color" id="card-color" x-model="form.color" />

    <label for="card-code">Barcode Code</label>
    <input type="text" id="card-code" x-model="form.code" @input="autoDetectType()" required
      placeholder="Type or scan below" />

    <label for="card-type">Barcode Type</label>
    <select id="card-type" x-model="form.barcodeType" @change="form.manualTypeOverride = true">
      <option value="ean13">EAN-13</option>
      <option value="ean8">EAN-8</option>
      <option value="code39">Code 39</option>
      <option value="code128">Code 128</option>
      <option value="interleaved2of5">ITF (Interleaved 2 of 5)</option>
      <option value="qrcode">QR Code</option>
    </select>

    <label for="card-scan">Scan Barcode</label>
    <input type="file" id="card-scan" accept="image/*" capture="environment"
      @change="scanBarcode($event.target.files[0]); $event.target.value = null" />

    <div style="display: flex; gap: 8px; margin-top: 16px">
      <button type="submit" x-text="editingId ? 'Save' : 'Add'"></button>
      <button type="button" @click="navigateTo(editingId ? 'view' : 'list', editingId)" class="btn-link">
        Cancel
      </button>
    </div>
  </form>
</div>
        </div>
      </template>

      <!-- Settings -->
      <template x-if="currentPage === 'settings'">
        <div>
          <div>
  <h2>Settings</h2>

  <h3>Backup</h3>
  <p>
    Copy this JSON as a backup. You can paste it below to restore your cards.
  </p>
  <textarea
    id="settings-export"
    readonly
    x-effect="$el.value = exportJSON()"
  ></textarea>
  <button @click="copyExport()" style="margin-top: 8px">Copy</button>

  <h3 style="margin-top: 32px">Restore</h3>
  <p>Paste your backup JSON below and click Restore to replace all cards.</p>
  <textarea
    id="settings-import"
    x-model="restoreText"
    placeholder="Paste JSON here..."
  ></textarea>
  <button @click="restoreFromJSON(restoreText)" style="margin-top: 8px">
    Restore
  </button>
</div>

        </div>
      </template>
    </main>

    <!-- Toast Container -->
    <div class="toast-container">
  <template x-for="toast in toasts" :key="toast.id">
    <div
      class="toast"
      x-text="toast.message"
      @click="removeToast(toast.id)"
    ></div>
  </template>
</div>

  </div>
  <script type="module" src="app.js"></script>
</body>

</html>
